name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
          POSTGRES_DB: wallab
        options: >-
          --health-cmd "pg_isready -U lab -d wallab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./internal/cdc/... ./internal/sink/...
        env:
          PGCDC_TEST_DSN: postgres://lab:lab@localhost:5433/wallab

      - name: Test proxy (no DB needed)
        run: go test -race -count=1 ./internal/proxy/... -run TestClassify

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <!--
    waltap — Architecture Diagram (animated)
    Renders inline in GitHub markdown without any JS. SMIL + CSS animations.
    Static fallback: even if animations don't render, the structure is fully readable.
  -->
  <defs>
    <!-- gradient backgrounds -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="pg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#336791" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#336791" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="core-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39d353" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#39d353" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sink-stdout" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8c5a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff8c5a" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sink-webhook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sink-kafka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d2a8ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d2a8ff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sink-dlq" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0c674" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f0c674" stop-opacity="0.05"/>
    </linearGradient>

    <!-- particle glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- subtle grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>

    <!-- particle: re-usable green dot for animation -->
    <circle id="p-green" r="5" fill="#39d353" filter="url(#glow)"/>
    <circle id="p-postgres" r="5" fill="#58a6ff" filter="url(#glow)"/>
  </defs>

  <style>
    /* Animations baked into the SVG */
    @keyframes dash {
      to { stroke-dashoffset: -20; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes node-pulse {
      0%, 100% { filter: drop-shadow(0 0 0 transparent); }
      50% { filter: drop-shadow(0 0 6px #39d353); }
    }
    .flow-line {
      stroke-dasharray: 4 4;
      animation: dash 1.2s linear infinite;
    }
    .flow-line.pg-line {
      animation-duration: 1.5s;
    }
    .live-dot {
      animation: pulse 1.6s ease-in-out infinite;
    }
    .label-mono { font-size: 13px; fill: #f0f6fc; font-weight: 600; }
    .label-ann  { font-size: 10px; fill: #8b949e; }
    .label-hdr  { font-size: 11px; fill: #8b949e; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 500; }
    .label-title { font-size: 18px; fill: #f0f6fc; font-weight: 700; letter-spacing: -0.5px; }
    .label-sub   { font-size: 11px; fill: #8b949e; }
    .accent-green { fill: #39d353; }
  </style>

  <!-- BACKGROUND -->
  <rect width="1200" height="600" fill="url(#bg-grad)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- macOS-style title bar -->
  <g transform="translate(0,0)">
    <rect width="1200" height="36" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="18" r="6" fill="#27c93f"/>
    <text x="600" y="22" text-anchor="middle" class="label-ann" font-size="11">waltap — system architecture · live stream</text>
    <g transform="translate(1180,18)">
      <circle cx="-130" cy="0" r="3" fill="#39d353" class="live-dot"/>
      <text x="-120" y="4" class="label-ann" font-size="10">streaming · LSN 0/19CFB20</text>
    </g>
  </g>

  <!-- TITLE BLOCK -->
  <g transform="translate(40,60)">
    <text class="label-hdr">walt<tspan class="accent-green">ap</tspan> · postgres CDC pipeline + R/W proxy</text>
    <text y="22" class="label-title">From WAL <tspan fill="#39d353">→</tspan> structured events <tspan fill="#39d353">→</tspan> anywhere</text>
  </g>

  <!-- ===== SOURCE TIER: POSTGRESQL ===== -->
  <g transform="translate(80,170)">
    <rect width="200" height="80" rx="3" fill="url(#pg-grad)" stroke="#336791" stroke-width="1.5"/>
    <rect x="0" y="0" width="3" height="80" fill="#336791"/>
    <text x="100" y="32" text-anchor="middle" class="label-mono">PostgreSQL</text>
    <text x="100" y="50" text-anchor="middle" class="label-ann">wal_level=logical</text>
    <text x="100" y="65" text-anchor="middle" class="label-ann">pgoutput · proto v1</text>
  </g>

  <!-- WAL stream visualization (animated bar to the right of PostgreSQL) -->
  <g transform="translate(300,180)">
    <rect width="180" height="60" rx="3" fill="#161b22" stroke="#30363d"/>
    <text x="10" y="14" class="label-ann" font-size="9">PG_WAL · append-only</text>
    <!-- moving WAL records -->
    <g>
      <rect x="10" y="22" width="50" height="22" rx="2" fill="rgba(57,211,83,0.18)" stroke="#39d353" stroke-width="0.8">
        <animate attributeName="x" from="-50" to="180" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="35" y="37" text-anchor="middle" fill="#39d353" font-size="9" font-weight="600" pointer-events="none">
        INSERT
        <animate attributeName="x" from="-25" to="205" dur="4s" repeatCount="indefinite"/>
      </text>

      <rect x="10" y="22" width="50" height="22" rx="2" fill="rgba(57,211,83,0.18)" stroke="#39d353" stroke-width="0.8">
        <animate attributeName="x" from="-50" to="180" dur="4s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <text x="35" y="37" text-anchor="middle" fill="#39d353" font-size="9" font-weight="600" pointer-events="none">
        UPDATE
        <animate attributeName="x" from="-25" to="205" dur="4s" begin="1s" repeatCount="indefinite"/>
      </text>

      <rect x="10" y="22" width="50" height="22" rx="2" fill="rgba(57,211,83,0.18)" stroke="#39d353" stroke-width="0.8">
        <animate attributeName="x" from="-50" to="180" dur="4s" begin="2s" repeatCount="indefinite"/>
      </rect>
      <text x="35" y="37" text-anchor="middle" fill="#39d353" font-size="9" font-weight="600" pointer-events="none">
        DELETE
        <animate attributeName="x" from="-25" to="205" dur="4s" begin="2s" repeatCount="indefinite"/>
      </text>

      <rect x="10" y="22" width="50" height="22" rx="2" fill="rgba(57,211,83,0.18)" stroke="#39d353" stroke-width="0.8">
        <animate attributeName="x" from="-50" to="180" dur="4s" begin="3s" repeatCount="indefinite"/>
      </rect>
      <text x="35" y="37" text-anchor="middle" fill="#39d353" font-size="9" font-weight="600" pointer-events="none">
        COMMIT
        <animate attributeName="x" from="-25" to="205" dur="4s" begin="3s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- clip mask edges via gradient overlay -->
    <rect x="0" y="22" width="10" height="22" fill="url(#bg-grad)"/>
    <rect x="170" y="22" width="10" height="22" fill="url(#bg-grad)"/>
  </g>

  <text x="380" y="265" text-anchor="middle" class="label-ann" font-size="10">↓ logical replication (?replication=database)</text>

  <!-- Connection line from PG to Stream -->
  <path class="flow-line pg-line" d="M 180 250 L 180 290 L 480 290 L 480 320" fill="none" stroke="#336791" stroke-width="1.5"/>

  <!-- ===== CORE TIER: SNAPSHOT, STREAM, FILTER, SINK CHAIN ===== -->
  <g transform="translate(80,320)">
    <text x="0" y="-8" class="label-hdr" font-size="10">// core pipeline · cmd/pgcdc</text>

    <!-- Snapshot -->
    <g transform="translate(0,0)">
      <rect width="170" height="60" rx="3" fill="url(#core-grad)" stroke="#39d353" stroke-width="1.5"/>
      <rect x="0" y="0" width="3" height="60" fill="#39d353"/>
      <text x="85" y="26" text-anchor="middle" class="label-mono">Snapshot</text>
      <text x="85" y="44" text-anchor="middle" class="label-ann">REPEATABLE READ</text>
    </g>

    <!-- Stream -->
    <g transform="translate(200,0)">
      <rect width="170" height="60" rx="3" fill="url(#core-grad)" stroke="#39d353" stroke-width="1.5"/>
      <rect x="0" y="0" width="3" height="60" fill="#39d353"/>
      <text x="85" y="26" text-anchor="middle" class="label-mono">Stream</text>
      <text x="85" y="44" text-anchor="middle" class="label-ann">copy-both · ack LSN</text>
    </g>

    <!-- Filter -->
    <g transform="translate(400,0)">
      <rect width="170" height="60" rx="3" fill="url(#core-grad)" stroke="#39d353" stroke-width="1.5"/>
      <rect x="0" y="0" width="3" height="60" fill="#39d353"/>
      <text x="85" y="26" text-anchor="middle" class="label-mono">Filter</text>
      <text x="85" y="44" text-anchor="middle" class="label-ann">tables · actions</text>
    </g>

    <!-- Sink Chain -->
    <g transform="translate(600,0)">
      <rect width="170" height="60" rx="3" fill="url(#core-grad)" stroke="#d2a8ff" stroke-width="1.5"/>
      <rect x="0" y="0" width="3" height="60" fill="#d2a8ff"/>
      <text x="85" y="26" text-anchor="middle" class="label-mono">Sink Chain</text>
      <text x="85" y="44" text-anchor="middle" class="label-ann">decorators</text>
    </g>

    <!-- Connectors between core nodes -->
    <line x1="170" y1="30" x2="200" y2="30" stroke="#39d353" stroke-width="1.5" stroke-dasharray="3 3" class="flow-line"/>
    <line x1="370" y1="30" x2="400" y2="30" stroke="#39d353" stroke-width="1.5" stroke-dasharray="3 3" class="flow-line"/>
    <line x1="570" y1="30" x2="600" y2="30" stroke="#39d353" stroke-width="1.5" stroke-dasharray="3 3" class="flow-line"/>
  </g>

  <!-- ===== SINK FAN-OUT ===== -->
  <text x="765" y="425" text-anchor="middle" class="label-ann" font-size="10">↓ fan-out</text>
  <!-- Fan-out lines from Sink Chain to each sink -->
  <path class="flow-line" d="M 765 380 L 765 410 L 250 410 L 250 460" stroke="#ff8c5a" stroke-width="1.5" fill="none"/>
  <path class="flow-line" d="M 765 380 L 765 410 L 480 410 L 480 460" stroke="#58a6ff" stroke-width="1.5" fill="none"/>
  <path class="flow-line" d="M 765 380 L 765 410 L 710 410 L 710 460" stroke="#d2a8ff" stroke-width="1.5" fill="none"/>
  <path class="flow-line" d="M 765 380 L 765 410 L 940 410 L 940 460" stroke="#f0c674" stroke-width="1.5" fill="none"/>

  <g transform="translate(80,460)">
    <text x="0" y="-8" class="label-hdr" font-size="10">// sinks · pluggable destinations</text>

    <!-- stdout -->
    <g transform="translate(100,0)">
      <rect width="160" height="58" rx="3" fill="url(#sink-stdout)" stroke="#ff8c5a" stroke-width="1.5"/>
      <rect x="0" y="0" width="3" height="58" fill="#ff8c5a"/>
      <text x="80" y="25" text-anchor="middle" class="label-mono">stdout</text>
      <text x="80" y="42" text-anchor="middle" class="label-ann">NDJSON</text>
    </g>

    <!-- webhook -->
    <g transform="translate(320,0)">
      <rect width="160" height="58" rx="3" fill="url(#sink-webhook)" stroke="#58a6ff" stroke-width="1.5"/>
      <rect x="0" y="0" width="3" height="58" fill="#58a6ff"/>
      <text x="80" y="25" text-anchor="middle" class="label-mono">webhook</text>
      <text x="80" y="42" text-anchor="middle" class="label-ann">HTTP POST per event</text>
    </g>

    <!-- kafka -->
    <g transform="translate(540,0)">
      <rect width="160" height="58" rx="3" fill="url(#sink-kafka)" stroke="#d2a8ff" stroke-width="1.5"/>
      <rect x="0" y="0" width="3" height="58" fill="#d2a8ff"/>
      <text x="80" y="25" text-anchor="middle" class="label-mono">kafka</text>
      <text x="80" y="42" text-anchor="middle" class="label-ann">per-table topics</text>
    </g>

    <!-- DLQ -->
    <g transform="translate(760,0)">
      <rect width="160" height="58" rx="3" fill="url(#sink-dlq)" stroke="#f0c674" stroke-width="1.5"/>
      <rect x="0" y="0" width="3" height="58" fill="#f0c674"/>
      <text x="80" y="25" text-anchor="middle" class="label-mono">DLQ</text>
      <text x="80" y="42" text-anchor="middle" class="label-ann">JSONL · poison events</text>
    </g>
  </g>

  <!-- ===== ANIMATED PARTICLES TRAVELING THE PIPELINE ===== -->
  <!-- Particle 1: PG → Stream → Filter → Chain → stdout -->
  <g>
    <use href="#p-green">
      <animateMotion dur="5s" repeatCount="indefinite" rotate="0">
        <mpath href="#path-flow-1"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.05;0.3;0.7;0.95;1" dur="5s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- Particle 2: PG → Stream → Filter → Chain → webhook (delayed) -->
  <g>
    <use href="#p-green">
      <animateMotion dur="5s" begin="1.2s" repeatCount="indefinite" rotate="0">
        <mpath href="#path-flow-2"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.05;0.3;0.7;0.95;1" dur="5s" begin="1.2s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- Particle 3: PG → Stream → Filter → Chain → kafka -->
  <g>
    <use href="#p-green">
      <animateMotion dur="5s" begin="2.4s" repeatCount="indefinite" rotate="0">
        <mpath href="#path-flow-3"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.05;0.3;0.7;0.95;1" dur="5s" begin="2.4s" repeatCount="indefinite"/>
    </use>
  </g>
  <!-- Particle 4: PG → Snapshot → Filter → Chain → kafka (snapshot path) -->
  <g>
    <use href="#p-postgres">
      <animateMotion dur="5s" begin="3.6s" repeatCount="indefinite" rotate="0">
        <mpath href="#path-flow-4"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;1;1;0" keyTimes="0;0.05;0.3;0.7;0.95;1" dur="5s" begin="3.6s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Motion paths (invisible) - matching the visible flow lines exactly -->
  <!-- All particles start at the Postgres node (180,210). Coordinates are absolute. -->
  <!-- PG bottom: (180,250). Stream center: (365,350). Filter center: (565,350). Chain center: (765,350). Sinks: stdout(260,489), webhook(480,489), kafka(700,489), DLQ(920,489) -->
  <path id="path-flow-1" d="M 180 210 L 180 250 L 180 290 L 480 290 L 365 320 L 365 350 L 400 350 L 565 350 L 600 350 L 765 350 L 765 410 L 260 410 L 260 460" fill="none" stroke="none"/>
  <path id="path-flow-2" d="M 180 210 L 180 250 L 180 290 L 480 290 L 365 320 L 365 350 L 400 350 L 565 350 L 600 350 L 765 350 L 765 410 L 480 410 L 480 460" fill="none" stroke="none"/>
  <path id="path-flow-3" d="M 180 210 L 180 250 L 180 290 L 480 290 L 365 320 L 365 350 L 400 350 L 565 350 L 600 350 L 765 350 L 765 410 L 710 410 L 710 460" fill="none" stroke="none"/>
  <path id="path-flow-4" d="M 180 210 L 180 250 L 180 290 L 165 290 L 165 320 L 165 350 L 200 350 L 400 350 L 565 350 L 600 350 L 765 350 L 765 410 L 710 410 L 710 460" fill="none" stroke="none"/>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(80,550)">
    <text class="label-hdr" font-size="9">legend</text>
    <g transform="translate(70,-3)">
      <circle r="4" fill="#39d353" filter="url(#glow)"/>
      <text x="10" y="4" class="label-ann">change event</text>
    </g>
    <g transform="translate(180,-3)">
      <circle r="4" fill="#58a6ff" filter="url(#glow)"/>
      <text x="10" y="4" class="label-ann">snapshot row</text>
    </g>
    <g transform="translate(290,-3)">
      <line x1="0" y1="0" x2="20" y2="0" stroke="#39d353" stroke-width="1.5" stroke-dasharray="3 3" class="flow-line"/>
      <text x="28" y="4" class="label-ann">data flow</text>
    </g>
    <g transform="translate(400,-3)">
      <rect x="-4" y="-4" width="8" height="8" fill="url(#core-grad)" stroke="#39d353" stroke-width="1"/>
      <text x="10" y="4" class="label-ann">core component</text>
    </g>
    <g transform="translate(540,-3)">
      <rect x="-4" y="-4" width="8" height="8" fill="url(#sink-webhook)" stroke="#58a6ff" stroke-width="1"/>
      <text x="10" y="4" class="label-ann">sink destination</text>
    </g>
  </g>

  <!-- Repo footer -->
  <text x="1180" y="568" text-anchor="end" class="label-ann" font-size="10">github.com/12345debdut/waltap</text>
</svg>
